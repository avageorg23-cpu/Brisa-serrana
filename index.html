<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reservas Brisa Serrana</title>

  <!-- SDK oficial de PayPal para USD -->
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>

  <style>
    * { box-sizing: border-box; }

    :root{
      --pad: clamp(10px, 2.0vw, 18px);
      --day: clamp(38px, 8.6vw, 46px);
      --gap: clamp(7px, 1.4vw, 10px);
    }

    body {
      margin: 0; 
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-image: linear-gradient(rgba(18, 18, 18, 0.6), rgba(18, 18, 18, 0.8)), url('https://lh3.googleusercontent.com/d/17KYey5qeqhP_eaIKCG-K6PE-FIS48ci9');
      background-size: cover; 
      background-position: center; 
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff; 
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom)) var(--pad);
    }

    .container{
      background: rgba(18, 18, 18, 0.82);
      border: 1px solid rgba(255,255,255,0.22);
      padding: 24px 20px 26px;
      border-radius: 24px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 14px 38px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
      max-height: calc(100dvh - (var(--pad) * 2));
      overflow-y: auto;
    }

    h2{ margin:0 0 6px; font-size: clamp(1.4rem, 3.8vw, 1.85rem); font-weight: 800; }
    .subtitle{ margin:0 0 12px; font-size: clamp(.90rem, 2.6vw, .98rem); opacity:.9; }

    /* Llamador de atención para 10% OFF */
    .promo-banner {
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #111;
      font-weight: 900;
      font-size: 0.88rem;
      padding: 8px 12px;
      border-radius: 999px;
      margin: 10px 0 14px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .top-row{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin: 6px 0 10px;
    }

    select{
      -webkit-appearance:none;
      appearance:none;
      padding: 11px 38px 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      color:#fff;
      font-size: clamp(.92rem, 2.5vw, .98rem);
      font-weight:700;
      min-width: min(180px, 92vw);
      outline:none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .select-wrap{ position:relative; display:inline-block; }
    .select-wrap:after{
      content:"▾";
      position:absolute; right:16px; top:50%;
      transform:translateY(-50%);
      color:rgba(255,255,255,0.85);
      pointer-events:none;
    }

    .capacity-badge {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #f3ee9a;
    }

    .price-line{
      margin: 6px 0 12px;
      font-size: 0.95rem;
      font-weight: 800;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 9px 16px;
      border-radius: 999px;
      display: inline-block;
    }

    .calendar-nav{ display:flex; justify-content:center; gap:10px; margin-top: 8px; }

    button{
      border:none; border-radius: 999px; padding: 10px 16px;
      font-family:inherit; font-weight:800; cursor:pointer; color:#fff;
      background: rgba(0, 51, 102, 0.92);
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
      transition: background 0.2s;
    }
    button:hover { background: rgba(0, 70, 140, 0.95); }

    .month-wrap{ display:flex; align-items:center; justify-content:center; margin: 16px 0 8px; }
    .month-year-title{ margin:0; font-size: 1.05rem; background: rgba(0,0,0,0.35); padding: 8px 16px; border-radius: 999px; display:inline-block; }

    table{
      width:100%; border-collapse: separate; border-spacing: var(--gap);
      background: rgba(255,255,255,0.96); color:#000; border-radius: 18px; padding: 12px;
      margin-bottom: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    th{ color: rgba(0,0,0,0.6); font-size: 0.75rem; text-transform: uppercase; font-weight: 800; }
    td > .day{
      width: var(--day); height: var(--day); margin: 0 auto; border-radius: 999px;
      display:grid; place-items:center; font-weight: 800; background: rgba(0,0,0,0.05);
    }
    td.available > .day{ background: rgba(200,247,197,0.95); color: #1b4d1e; cursor:pointer; }
    td.available > .day:hover { background: rgba(170, 240, 165, 1); }
    td.unavailable > .day{ background: rgba(0,0,0,0.08); color: rgba(0,0,0,0.3); cursor:not-allowed; }
    td.checkin > .day, td.checkout > .day{ background: #003366 !important; color:#fff !important; }
    td.selected-day > .day{ background: rgba(0, 51, 102, 0.15) !important; color: #002244; }

    .payment-info{
      background: rgba(255,255,255,0.97); color:#111; padding: 16px;
      border-radius: 18px; margin-top: 14px; text-align:left; font-size: .92rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .payment-info h4 { margin: 0 0 8px; font-size: 1.05rem; color: #003366; }
    .payment-info p { margin: 6px 0; }
    
    .user-form { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
    .user-form input { padding: 11px 14px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.2); font-family: inherit; font-size: 0.95rem; }

    #pay-btn{
      display:block; width:100%; margin-top: 12px; font-weight: 900; font-size: 1rem;
      padding: 13px; border-radius: 999px; text-align:center; color:#fff;
      background: #003366; border: none; cursor: pointer;
    }
    #pay-btn.disabled{ opacity:.5; pointer-events:none; }
    #paypal-button-container { margin-top: 14px; }
  </style>
</head>

<body>
  <div class="container">
    <h2>Reservá en Brisa Serrana</h2>
    <p class="subtitle">Elegí tu alojamiento ideal y seleccioná tus fechas</p>

    <div class="promo-banner">🔥 ¡10% OFF reservando 10 o más noches! 🔥</div>

    <div class="top-row">
      <span class="select-wrap">
        <select id="bungalow">
          <option value="DUPLEX">DUPLEX</option>
          <option value="LOFT">LOFT</option>
          <option value="ALPINA DE MONTAÑA">ALPINA DE MONTAÑA (No disponible)</option>
        </select>
      </span>
      
      <span class="select-wrap">
        <select id="moneda">
          <option value="ARS">Pesos ARS</option>
          <option value="USD">Dólares USD</option>
        </select>
      </span>
    </div>

    <div id="capacity-display" class="capacity-badge">Capacidad: 5 personas</div>
    <div>
      <div id="price-line" class="price-line">Calculando...</div>
    </div>

    <div class="calendar-nav">
      <button type="button" onclick="changeMonth(-1)">Mes anterior</button>
      <button type="button" onclick="changeMonth(1)">Mes siguiente</button>
    </div>

    <div id="calendar-container"></div>

    <div class="payment-info" id="payment-section" style="display:none;">
      <h4>Resumen de Reserva</h4>
      <p id="nights-info"></p>
      <p id="amount-info"></p>
      <p id="deposit-info" style="font-weight: 800; color: #b32a2a; margin-top: 8px;"></p>

      <div id="user-data-form" class="user-form" style="display: none;">
        <input type="text" id="cli-nombre" placeholder="Nombre" required>
        <input type="text" id="cli-apellido" placeholder="Apellido" required>
        <input type="tel" id="cli-contacto" placeholder="WhatsApp / Teléfono" required>
      </div>

      <div id="paypal-button-container" style="display:none;"></div>
      <button id="pay-btn" type="button" class="disabled">Completar datos</button>
    </div>
  </div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWdA_eJL5ydTcZPpyvFo00f8pB0A3v9NOvh33lCyTEkowq-PBxjAUNSJj9I5c7Xyd9/exec"; 
  const TIPO_CAMBIO_USD = 1000; 

  const preciosFallback = {
    "DUPLEX": { 5: 105000 },
    "LOFT": { 4: 75000 },
    "ALPINA DE MONTAÑA": { 5: 95000 }
  };

  const capacidadesFijas = {
    "DUPLEX": 5,
    "LOFT": 4,
    "ALPINA DE MONTAÑA": 5
  };

  let preciosDinámicos = JSON.parse(JSON.stringify(preciosFallback)); 
  
  let currentDate = new Date();
  const occupiedCache = new Map();
  let selection = { checkin: null, checkout: null, nights: 0 };
  let paypalInitialized = false;

  function actualizarInfoAlojamiento() {
    const room = document.getElementById("bungalow").value;
    const capacityBadge = document.getElementById("capacity-display");
    const maxPax = capacidadesFijas[room] || 2;
    
    if (room === "ALPINA DE MONTAÑA") {
      capacityBadge.textContent = "Alojamiento no disponible temporalmente";
      capacityBadge.style.background = "rgba(179, 42, 42, 0.3)";
      capacityBadge.style.borderColor = "rgba(179, 42, 42, 0.5)";
    } else {
      capacityBadge.textContent = `Capacidad total: ${maxPax} personas`;
      capacityBadge.style.background = "rgba(255,255,255,0.1)";
      capacityBadge.style.borderColor = "rgba(255,255,255,0.2)";
    }

    updatePriceLine();
  }

  function fmtARS(n){
    return new Intl.NumberFormat("es-AR", { style:"currency", currency:"ARS", maximumFractionDigits:0 }).format(n);
  }

  function obtenerPrecioBase() {
    const room = document.getElementById("bungalow").value;
    if (!preciosDinámicos[room]) return 0;
    const paxKeys = Object.keys(preciosDinámicos[room]);
    if (paxKeys.length === 0) return 0;
    return preciosDinámicos[room][paxKeys[0]] || 0;
  }

  function updatePriceLine(){
    const room = document.getElementById("bungalow").value;
    const moneda = document.getElementById("moneda").value;
    const el = document.getElementById("price-line");
    
    const precioArs = obtenerPrecioBase();

    if (el) {
      if (room === "ALPINA DE MONTAÑA" || precioArs === 0) {
        el.textContent = room === "ALPINA DE MONTAÑA" ? "No disponible para reservas" : "Revisá los precios de este Alojamiento";
        return;
      }

      const maxPax = capacidadesFijas[room];
      const textoPax = ` (hasta ${maxPax} pax)`;

      if (moneda === "ARS") {
        el.textContent = `${room}${textoPax} · ${fmtARS(precioArs)} por noche`;
      } else {
        const precioUsd = (precioArs / TIPO_CAMBIO_USD).toFixed(0);
        el.textContent = `${room}${textoPax} · $${precioUsd} USD por noche`;
      }
    }
    updateSummary(); 
  }

  async function cargarPreciosDesdeSheet() {
    try {
      const response = await fetch(`${APPS_SCRIPT_URL}?action=getPrecios&t=${Date.now()}`);
      const data = await response.json();
      
      if (data && Object.keys(data).length > 0) {
        preciosDinámicos = data;
        updatePriceLine();
      }
    } catch (e) {
      console.warn("No se pudo leer la hoja. Usando precios de respaldo.", e);
      updatePriceLine(); 
    }
  }

  function toISO(dateObj){
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth()+1).padStart(2,"0");
    const d = String(dateObj.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }

  function fmtISO(iso){
    if(!iso) return "";
    const [y,m,d] = iso.split("-");
    return `${d}/${m}/${y}`;
  }

  function isoToDate(iso){
    const [y,m,d] = iso.split("-");
    return new Date(Number(y), Number(m)-1, Number(d));
  }

  function diffNights(checkinISO, checkoutISO){
    return Math.round((isoToDate(checkoutISO) - isoToDate(checkinISO)) / (1000*60*60*24));
  }

  function enumerateNights(checkinISO, checkoutISO){
    const out = [];
    const cur = new Date(isoToDate(checkinISO));
    const end = isoToDate(checkoutISO);
    while(cur < end){
      out.push(toISO(cur));
      cur.setDate(cur.getDate()+1);
    }
    return out;
  }

  function clearCalendarHighlights(){
    document.querySelectorAll("td.selected-day, td.checkin, td.checkout")
      .forEach(td => td.classList.remove("selected-day","checkin","checkout"));
  }

  function highlightRange(checkinISO, checkoutISO){
    if (!checkinISO || !checkoutISO) return;
    enumerateNights(checkinISO, checkoutISO).forEach(iso => {
      const td = document.querySelector(`td[data-fecha="${iso}"]`);
      if (td) td.classList.add("selected-day");
    });
  }

  function applySelectionHighlights() {
    clearCalendarHighlights();
    if (selection.checkin) {
      const checkinTd = document.querySelector(`td[data-fecha="${selection.checkin}"]`);
      if (checkinTd) checkinTd.classList.add("checkin");
    }
    if (selection.checkout) {
      highlightRange(selection.checkin, selection.checkout);
      const checkoutTd = document.querySelector(`td[data-fecha="${selection.checkout}"]`);
      if (checkoutTd) checkoutTd.classList.add("checkout");
    }
  }

  async function loadOccupiedForRoom(room, forceRefresh = false){
    if (room === "ALPINA DE MONTAÑA") {
      return new Set(); // Bloqueada por completo
    }
    if (!forceRefresh && occupiedCache.has(room)) {
      return occupiedCache.get(room);
    }
    try {
      const r = await fetch(`${APPS_SCRIPT_URL}?action=getDispo&room=${encodeURIComponent(room)}&t=${Date.now()}`, { cache: "no-store" });
      const rows = await r.json();
      const occupied = new Set();
      for (let i = 1; i < rows.length; i++){
        const rr = rows[i];
        if (!rr || rr.length === 0) continue;
        if (rr[0]) occupied.add(String(rr[0]).trim());
      }
      occupiedCache.set(room, occupied);
      return occupied;
    } catch (e) {
      console.warn("Error cargando disponibilidad:", e);
      return new Set();
    }
  }

  function generarTablaMes(dateObj, occupied) {
    const year = dateObj.getFullYear();
    const month = dateObj.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const room = document.getElementById("bungalow").value;

    const monthWrap = document.createElement("div");
    monthWrap.className = "month-wrap";
    monthWrap.innerHTML = `<h3 class="month-year-title">${dateObj.toLocaleString("es-ES", { month: "long", year: "numeric" })}</h3>`;

    const table = document.createElement("table");
    table.innerHTML = `
      <thead>
        <tr><th>Dom</th><th>Lun</th><th>Mar</th><th>Mié</th><th>Jue</th><th>Vie</th><th>Sáb</th></tr>
      </thead>
    `;
    
    const tbody = document.createElement("tbody");
    let row = document.createElement("tr");

    for (let i = 0; i < firstDay; i++) row.appendChild(document.createElement("td"));

    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(year, month, day);
      const td = document.createElement("td");
      td.innerHTML = `<div class="day">${day}</div>`;
      const iso = toISO(date);
      td.dataset.fecha = iso;

      if (room === "ALPINA DE MONTAÑA") {
        td.className = "unavailable"; // Alpina totalmente bloqueada
      } else if (date < new Date(new Date().setHours(0,0,0,0))) {
        td.className = "unavailable";
      } else if (occupied.has(iso)){
        td.className = "unavailable";
      } else {
        td.className = "available";
        td.onclick = () => onDayClick(iso);
      }
      row.appendChild(td);
      if (date.getDay() === 6){ tbody.appendChild(row); row = document.createElement("tr"); }
    }
    if (row.children.length > 0) tbody.appendChild(row);
    table.appendChild(tbody);

    const block = document.createElement("div");
    block.appendChild(monthWrap);
    block.appendChild(table);
    return block;
  }

  async function loadAvailabilityData(){
    const room = document.getElementById("bungalow").value;
    const container = document.getElementById("calendar-container");
    container.innerHTML = "";
    
    let occupied = occupiedCache.get(room) || new Set();

    const mes1Block = generarTablaMes(currentDate, occupied);
    container.appendChild(mes1Block);

    const nextDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
    const mes2Block = generarTablaMes(nextDate, occupied);
    container.appendChild(mes2Block);

    applySelectionHighlights();
    updatePriceLine();

    if (room !== "ALPINA DE MONTAÑA") {
      loadOccupiedForRoom(room, true).then(freshOccupied => {
        freshOccupied.forEach(iso => {
          document.querySelectorAll(`td[data-fecha="${iso}"]`).forEach(td => {
            if (!td.classList.contains("checkin") && !td.classList.contains("checkout")) {
              td.className = "unavailable";
              td.onclick = null;
            }
          });
        });
      });
    }
  }

  function changeMonth(offset){
    currentDate.setMonth(currentDate.getMonth() + offset);
    loadAvailabilityData();
  }

  function onDayClick(isoDate){
    const room = document.getElementById("bungalow").value;
    if (room === "ALPINA DE MONTAÑA") return;
    const occupied = occupiedCache.get(room) || new Set();

    if (!selection.checkin || selection.checkout){
      selection.checkin = isoDate;
      selection.checkout = null;
      applySelectionHighlights();
      updateSummary();
      return;
    }

    if (isoDate <= selection.checkin){
      selection.checkin = isoDate;
      selection.checkout = null;
      applySelectionHighlights();
      updateSummary();
      return;
    }

    if (enumerateNights(selection.checkin, isoDate).some(n => occupied.has(n))){
      alert("Hay una noche ocupada en el rango seleccionado.");
      return;
    }

    selection.checkout = isoDate;
    selection.nights = diffNights(selection.checkin, selection.checkout);
    applySelectionHighlights();
    updateSummary();
  }

  function updateSummary(){
    const { checkin, checkout, nights } = selection;
    const room = document.getElementById("bungalow").value;
    const moneda = document.getElementById("moneda").value;
    
    if (!checkin || room === "ALPINA DE MONTAÑA") { 
      document.getElementById("payment-section").style.display = "none"; 
      return; 
    }
    document.getElementById("payment-section").style.display = "block";

    const userForm = document.getElementById("user-data-form");
    const payBtn = document.getElementById("pay-btn");
    const paypalContainer = document.getElementById("paypal-button-container");

    const maxPax = capacidadesFijas[room];
    const textoPax = ` (${maxPax} pax máx)`;

    if (!checkout){
      document.getElementById("nights-info").textContent = `${room}${textoPax} · Ingreso: ${fmtISO(checkin)}`;
      document.getElementById("amount-info").textContent = `Elegí la fecha de salida.`;
      document.getElementById("deposit-info").textContent = "";
      userForm.style.display = "none";
      payBtn.style.display = "block";
      payBtn.classList.add("disabled");
      payBtn.textContent = "Completar datos";
      paypalContainer.style.display = "none";
      return;
    }

    document.getElementById("nights-info").textContent = `${room}${textoPax} · ${nights} noches (${fmtISO(checkin)} al ${fmtISO(checkout)})`;
    userForm.style.display = "flex";

    const precioBase = obtenerPrecioBase();
    let subtotal = nights * precioBase;
    let aplicaDescuento = nights >= 10;
    
    if (aplicaDescuento) {
      subtotal = subtotal * 0.90; // 10% de descuento
    }

    if (moneda === "ARS") {
      const montoSenia = subtotal * 0.40; // Seña 40%
      const montoRestante = subtotal * 0.60; // 60% en el hospedaje

      if (aplicaDescuento) {
        document.getElementById("amount-info").innerHTML = `Total con 10% OFF aplicado: <b>${fmtARS(subtotal)}</b> <span style="font-size:0.8rem; color:#2e7d32;">(¡Ahorraste un 10% por 10+ noches!)</span>`;
      } else {
        document.getElementById("amount-info").innerHTML = `Total estimado: <b>${fmtARS(subtotal)}</b>`;
      }

      document.getElementById("deposit-info").textContent = `Seña a abonar ahora (40%): ${fmtARS(montoSenia)} | Restante a abonar en el hospedaje (60%): ${fmtARS(montoRestante)}`;

      payBtn.style.display = "block";
      payBtn.classList.remove("disabled");
      payBtn.textContent = "Pagar Seña con Mercado Pago (40%)";
      payBtn.onclick = () => procesarPagoARS(montoSenia);
      paypalContainer.style.display = "none";
    } else {
      const precioBaseUSD = parseFloat((precioBase / TIPO_CAMBIO_USD).toFixed(2));
      let subtotalUSD = nights * precioBaseUSD;
      if (aplicaDescuento) subtotalUSD = subtotalUSD * 0.90;

      const montoSeniaUSD = subtotalUSD * 0.40;
      const montoRestanteUSD = subtotalUSD * 0.60;

      if (aplicaDescuento) {
        document.getElementById("amount-info").innerHTML = `Total con 10% OFF aplicado: <b>$${subtotalUSD.toFixed(2)} USD</b> <span style="font-size:0.8rem; color:#2e7d32;">(¡10% OFF incluido!)</span>`;
      } else {
        document.getElementById("amount-info").innerHTML = `Total estimado: <b>$${subtotalUSD.toFixed(2)} USD</b>`;
      }

      document.getElementById("deposit-info").textContent = `Seña a abonar ahora (40%): $${montoSeniaUSD.toFixed(2)} USD | Restante en el hospedaje (60%): $${montoRestanteUSD.toFixed(2)} USD`;

      payBtn.style.display = "none";
      paypalContainer.style.display = "block";

      if (!paypalInitialized && window.paypal) {
        paypalInitialized = true;
        paypal.Buttons({
          createOrder: function(data, actions) {
            const nombre = document.getElementById("cli-nombre").value.trim();
            const apellido = document.getElementById("cli-apellido").value.trim();
            const contacto = document.getElementById("cli-contacto").value.trim();
            if (!nombre || !apellido || !contacto) {
              alert("Por favor completá tu nombre, apellido y WhatsApp antes de pagar.");
              throw new Error("Datos incompletos");
            }
            const currentNights = selection.nights;
            let currentSub = currentNights * parseFloat((obtenerPrecioBase() / TIPO_CAMBIO_USD).toFixed(2));
            if (currentNights >= 10) currentSub = currentSub * 0.90;
            const currentDeposit = currentSub * 0.40;

            return actions.order.create({
              purchase_units: [{
                description: `Seña 40% de ${currentNights} noches en ${room}`,
                amount: { value: currentDeposit.toFixed(2) }
              }]
            });
          },
          onApprove: function(data, actions) {
            return actions.order.capture().then(function(details) {
              let sub = selection.nights * parseFloat((obtenerPrecioBase() / TIPO_CAMBIO_USD).toFixed(2));
              if (selection.nights >= 10) sub = sub * 0.90;
              enviarReservaAlServidor("USD", sub * 0.40);
            });
          }
        }).render('#paypal-button-container');
      }
    }
  }

  async function procesarPagoARS(montoSenia) {
    const nombre = document.getElementById("cli-nombre").value.trim();
    const apellido = document.getElementById("cli-apellido").value.trim();
    const contacto = document.getElementById("cli-contacto").value.trim();
    const payBtn = document.getElementById("pay-btn");

    if (!nombre || !apellido || !contacto) {
      payBtn.textContent = "¡Completá tus datos para continuar!";
      payBtn.style.background = "#b32a2a";
      setTimeout(() => {
        payBtn.textContent = "Pagar Seña con Mercado Pago (40%)";
        payBtn.style.background = "#003366";
      }, 3000);
      return;
    }

    payBtn.textContent = "Generando pago automatizado...";
    payBtn.classList.add("disabled");

    const room = document.getElementById("bungalow").value;
    const maxPax = capacidadesFijas[room];
    const payload = {
      bungalow: room,
      pasajeros: maxPax, 
      checkin: selection.checkin,
      checkout: selection.checkout,
      nombre: nombre,
      apellido: apellido,
      contacto: contacto,
      moneda: "ARS",
      noches: selection.nights,
      montoTotal: montoSenia // Envía el 40% correspondiente a la seña
    };

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      });
      
      const result = await response.json();

      if (result.status === "success" && result.init_point) {
        window.location.href = result.init_point;
      } else {
        console.error("Detalle del error:", result.message);
        payBtn.textContent = result.message ? result.message : "Error desconocido en pasarela";
        payBtn.style.background = "#b32a2a";
      }
    } catch (e) {
      console.error("Error:", e);
      payBtn.textContent = "Error de conexión con el servidor";
      payBtn.style.background = "#b32a2a";
    }
  }

  async function enviarReservaAlServidor(moneda, montoSenia) {
    const nombre = document.getElementById("cli-nombre").value.trim();
    const apellido = document.getElementById("cli-apellido").value.trim();
    const contacto = document.getElementById("cli-contacto").value.trim();
    const room = document.getElementById("bungalow").value;
    const maxPax = capacidadesFijas[room];

    const payload = {
      bungalow: room,
      pasajeros: maxPax,
      checkin: selection.checkin,
      checkout: selection.checkout,
      nombre: nombre,
      apellido: apellido,
      contacto: contacto,
      moneda: moneda,
      noches: selection.nights,
      montoTotal: montoSenia
    };

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      });
      
      const result = await response.json();

      if (result.status === "success" && moneda === "USD") {
        alert("¡Pago exitoso de la seña y reserva registrada con éxito!");
        location.reload();
      }
    } catch (e) {
      console.error("Error:", e);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get("status");
    const ref = urlParams.get("ref");

    if (status === "success") {
      alert("¡Pago aprobado con éxito! Tu seña ha sido registrada correctamente. Referencia: " + (ref || "N/A"));
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    actualizarInfoAlojamiento();
    cargarPreciosDesdeSheet();

    const bungalowSelect = document.getElementById("bungalow");
    bungalowSelect.addEventListener("change", () => {
      selection = { checkin: null, checkout: null, nights: 0 };
      document.getElementById("payment-section").style.display = "none";
      
      actualizarInfoAlojamiento();
      loadAvailabilityData();
      loadOccupiedForRoom(bungalowSelect.value, true);
    });

    document.getElementById("moneda").addEventListener("change", updatePriceLine);
    
    loadOccupiedForRoom(bungalowSelect.value).then(() => {
      loadAvailabilityData();
    });
  });
</script>
</body>
</html>
